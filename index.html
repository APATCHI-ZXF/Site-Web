<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Palermo — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* هنا تم إضافة كود الخلفية، ضع اسم صورتك بدل background.jpg */
    body {
      background: linear-gradient(rgba(24, 30, 46, 0.85), rgba(24, 30, 46, 0.85)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #F1F5F9;
    }

    .login-card { background: rgba(30, 38, 56, 0.95); width: 100%; max-width: 380px; border-radius: 28px; padding: 40px 28px 36px; box-shadow: 10px 10px 26px #101420, -10px -10px 26px #2c3850; text-align: center; }
    .app-logo { width: 90px; height: 90px; margin: 0 auto 20px; border-radius: 50%; background: linear-gradient(135deg, #5865F2, #4752C4); display: flex; align-items: center; justify-content: center; box-shadow: 6px 6px 14px #101420, -6px -6px 14px #2c3850, 0 0 30px rgba(88, 101, 242, 0.4); }
    .app-logo svg { width: 50px; height: 50px; fill: white; }
    h2 { font-size: 24px; font-weight: 700; color: #FFFFFF; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #94A3B8; margin-bottom: 32px; line-height: 1.6; }
    .discord-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, #5865F2, #4752C4); color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-shadow: 4px 4px 12px #101420, -4px -4px 12px #2c3850; transition: all 0.2s ease; }
    .discord-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .discord-btn svg { width: 22px; height: 22px; fill: white; }
    .info-box { margin-top: 24px; padding: 14px 16px; background: #171E2D; border-radius: 12px; font-size: 12px; color: #94A3B8; line-height: 1.7; text-align: left; border: 1px solid #28334A; }
    .info-box strong { color: #38BDF8; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="app-logo">

    <p class="subtitle">Sign in with your Discord account<br>to access exclusive courses</p>

</html>
