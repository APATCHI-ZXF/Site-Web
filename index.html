<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Palermo — Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #181E2E; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #F1F5F9; }
    .card { background: #1E2638; width: 100%; max-width: 400px; border-radius: 28px; padding: 30px 24px; box-shadow: 10px 10px 26px #101420, -10px -10px 26px #2c3850; }
    h2 { font-size: 22px; font-weight: 700; color: #FFFFFF; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 18px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #94A3B8; margin-bottom: 8px; margin-left: 4px; }
    .input-box { display: flex; align-items: center; background: #1E2638; border-radius: 12px; padding: 4px 14px; box-shadow: inset 4px 4px 8px #131824, inset -4px -4px 8px #29344c; transition: all 0.25s ease; }
    .input-box:focus-within { box-shadow: inset 5px 5px 9px #101420, inset -5px -5px 9px #2e3a54, 0 0 0 1.5px #6366F1; }
    input, textarea { width: 100%; padding: 12px 8px; background: transparent; border: none; outline: none; color: #F8FAFC; font-size: 14px; resize: vertical; }
    textarea { min-height: 80px; }
    input::placeholder, textarea::placeholder { color: #64748B; }
    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, #6366F1, #4F46E5); color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 4px 4px 12px #101420, -4px -4px 12px #2c3850; transition: all 0.2s ease; }
    .btn-submit:hover { filter: brightness(1.1); }
    .btn-submit:active { box-shadow: inset 3px 3px 6px #3730A3, inset -3px -3px 6px #4F46E5; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Family Application</h2>
    <form action="/submit-form" method="POST">
      <div class="form-group">
        <label>Name IRL</label>
        <div class="input-box"><input type="text" name="name" placeholder="Your real name" required></div>
      </div>
      <div class="form-group">
        <label>Âge IRL</label>
        <div class="input-box"><input type="number" name="age" placeholder="Your age" required></div>
      </div>
      <div class="form-group">
        <label>Expérience RP</label>
        <div class="input-box"><textarea name="experience" placeholder="Describe your RP experience..." required></textarea></div>
      </div>
      <div class="form-group">
        <label>Chnwa el Plus Eli Bch Ta3tih lel Family</label>
        <div class="input-box"><textarea name="plus" placeholder="What will you add to the family?" required></textarea></div>
      </div>
      <button type="submit" class="btn-submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
